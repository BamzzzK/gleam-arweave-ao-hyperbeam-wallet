name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Kotlin extracts without a Gradle build; Swift can't, so it has its own job.
        language: [actions, javascript-typescript, java-kotlin]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # The dApp view plugin is a trust boundary, but it only compiles inside the
  # app: on its own, SwiftPM can't resolve Capacitor's Cordova module. So this
  # builds the whole app, which needs the web bundle and `cap sync` first.
  # Tracing the full build (every Capacitor plugin, SQLCipher's C) took ~20
  # minutes, so dependencies build untraced and only our own Swift is rebuilt
  # under CodeQL.
  # The Swift job takes ~17 minutes, so a pull request runs it only when it
  # changes what that job builds or how; otherwise `reuse-swift` reports
  # master's result. Master pushes and the weekly run always analyze, and a
  # failure here leaves the output empty, which runs it.
  swift-changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request checks out its merge commit, so HEAD^1 is the base.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          swift=false
          if [ "$EVENT" != pull_request ]; then
            swift=true
          else
            git diff --name-only HEAD^1 HEAD > changed.txt
            [ -s changed.txt ] || swift=true
            while IFS= read -r path; do
              case "$path" in
                apps/mobile/ios/*|apps/mobile/plugins/*|apps/mobile/package.json|apps/mobile/capacitor.config.*) swift=true ;;
                .github/workflows/codeql.yml|.github/codeql/*) swift=true ;;
              esac
            done < changed.txt
          fi
          echo "swift=$swift" | tee -a "$GITHUB_OUTPUT"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-15
    needs: swift-changes
    if: ${{ !cancelled() && needs.swift-changes.outputs.swift != 'false' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - run: pnpm --filter @gleam/mobile exec cap sync ios
      - run: >-
          xcodebuild
          -project apps/mobile/ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - run: >-
          find apps/mobile/ios/App/App apps/mobile/plugins
          -name '*.swift' -not -name Package.swift
          -not -path '*/node_modules/*' -not -path '*/.build/*'
          -exec touch {} +
      - run: >-
          xcodebuild
          -project apps/mobile/ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift

  # The code scanning rule waits for a result in every category master has,
  # so a pull request that skips the Swift build still needs a Swift result.
  # Its Swift is master's, so master's latest Swift analysis is its result:
  # this uploads that SARIF for the pull request. With no master analysis to
  # reuse, the job fails rather than pass the gate empty.
  reuse-swift:
    name: Analyze (swift, from master)
    runs-on: ubuntu-latest
    needs: swift-changes
    if: ${{ !cancelled() && needs.swift-changes.outputs.swift == 'false' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/code-scanning/analyses?ref=refs/heads/master&tool_name=CodeQL&per_page=100" \
            --jq '[.[] | select(.category == "/language:swift")][0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::master has no Swift analysis to reuse"
            exit 1
          fi
          echo "Reusing master's Swift analysis $id"
          gh api -H "Accept: application/sarif+json" "repos/$REPO/code-scanning/analyses/$id" > "$RUNNER_TEMP/swift.sarif"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/swift.sarif
          category: /language:swift
