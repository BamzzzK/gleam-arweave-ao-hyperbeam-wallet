name: Dependabot auto-merge

# Plain pull_request, not pull_request_target: Dependabot's runs still get
# the write permissions granted below, and no other fork PR does.
on: pull_request

permissions: {}

jobs:
  automerge:
    # The PR author, not github.actor: actor is whoever triggered this run,
    # which can be Dependabot on a PR someone else opened.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Only patch/minor updates to direct npm dev dependencies outside the
      # build-toolchain group. An Action bump runs in the release job with
      # write and OIDC tokens, and a production dependency or the bundler
      # writes what ships, so those get a human review; so does a security
      # advisory for a package with no patched version (see
      # elliptic/GHSA-848j-6mx2-7j84). scripts/workflows.ci.test.ts checks
      # every gh step keeps all four conditions.
      - if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          steps.metadata.outputs.dependency-group != 'build-toolchain'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Merge commit: the master ruleset requires signed commits and allows
      # only merge commits. GitHub signs the merge commit, and Dependabot's
      # own commit keeps its signature. GitHub can't sign rebase merges.
      - if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          steps.metadata.outputs.dependency-group != 'build-toolchain'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
