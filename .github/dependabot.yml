version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Hold new releases back a week so a hijacked version is usually pulled
    # before Dependabot proposes it (and, for a dev dependency, auto-merge
    # ships it).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Bundler, extension framework and their plugins arrive together in a
      # clearly labelled PR instead of hiding inside an unrelated bump (a
      # plugin-react bump once pulled in Vite 8 and broke the built popup).
      # Listed before the minor-patch groups because a dependency joins
      # the first group it matches. A major in this group needs the manual
      # Chrome check (load .output/chrome-mv3 unpacked) before merging.
      # It writes the shipped bundle, so it never auto-merges.
      build-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - wxt
          - "@wxt-dev/*"
          - rolldown
          - "@tailwindcss/vite"
          - vite-plugin-node-polyfills
      # Dev and production dependencies never share a group, so
      # fetch-metadata reports one dependency type for the PR and
      # dependabot-automerge.yml merges only the dev group on its own.
      npm-dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # CodeQL refuses to run when init and analyze differ in version, so
      # their bumps have to land in one PR.
      codeql-action:
        patterns:
          - github/codeql-action*
    commit-message:
      prefix: chore(ci)
